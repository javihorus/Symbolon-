<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <meta name="description" content="SYMBOLON · El juego del recuerdo — curso interactivo de estudio, biblioteca de 78 cartas, práctica y diario." />
  <title>SYMBOLON · El juego del recuerdo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="styles-v8.css?v=9" />
  <link rel="stylesheet" href="styles-v10.css?v=10" />
  <link rel="stylesheet" href="styles-v11.css?v=11" />
  <link rel="stylesheet" href="styles-v12.css?v=12" />
  <link rel="stylesheet" href="styles-v14.css?v=14" />
  <link rel="stylesheet" href="styles-v15.css?v=17" />
  <script>
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
    if('caches' in window){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));}
  </script>
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar">
    <button class="icon-btn mobile-only" id="menuBtn" aria-label="Abrir menú">☰</button>
    <a class="brand" href="#home"><span class="brand-mark">◐</span><span>SYMBOLON</span><span class="version-badge">V17</span></a>
    <div class="top-actions">
      <button class="ghost-btn" id="fontBtn" title="Tamaño de texto">Aa</button>
      <button class="ghost-btn" id="installBtn">Instalar</button>
      <button class="ghost-btn account-btn" id="accountBtn">Activar nube</button>
      <button class="ghost-btn" id="themeBtn" title="Cambiar tema">◐</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <div class="progress-card">
          <div class="eyebrow">DOMINIO DE SYMBOLON</div>
          <div class="progress-line"><div id="overallBar"></div></div>
          <div class="progress-meta"><span id="progressText">0 / 78 cartas</span><span id="progressPct">0%</span></div>
        </div>
        <nav class="main-nav">
          <button data-route="home">⌂ <span>Inicio</span></button>
          <button data-route="course">◫ <span>Aprender</span></button>
          <button data-route="cards">✦ <span>Las 78 cartas</span></button>
          <button data-route="practice">◎ <span>Practicar</span></button>
          <button data-route="journal">✎ <span>Mi diario</span></button>
          <button data-route="progress">◔ <span>Mi progreso</span></button>
        </nav>
        <div class="nav-divider"></div>
        <div class="module-caption">MÓDULOS DE APOYO</div>
        <nav id="moduleNav" class="module-nav"></nav>
        <div class="nav-divider"></div>
        <nav class="minor-nav"><button data-route="sources">Fuentes y método</button><button data-route="settings">Ajustes</button></nav>
      </div>
    </aside>
    <main id="app" class="app" tabindex="-1"></main>
  </div>
  <div class="player" id="player" hidden>
    <div class="player-track"><div id="audioProgress"></div></div>
    <div class="player-main"><button class="player-icon" id="audioPlay">▶</button><div class="player-copy"><strong id="audioTitle">Audio</strong><span id="audioStatus">Listo para escuchar</span></div><label class="rate">Velocidad <select id="audioRate"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><button class="player-icon" id="audioStop">■</button><button class="player-icon" id="playerClose">×</button></div>
  </div>
  <div id="modalHost"></div><div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="course-data.js"></script>
  <script src="cards-data-v8.js?v=9"></script>
  <script src="real-images-v9.js?v=9"></script>
  <script src="manual-insights-v12.js?v=12"></script>
  <script src="cases-data.js"></script>
  <script src="cloud-config.js?v=11"></script>
  <script src="cloud.js?v=17"></script>
  <script src="audio-data.js"></script>
  <script>
    // Native card links use ?open=cXX. Convert that to the internal route BEFORE
    // the SPA starts so the very first render is already the requested card.
    (()=>{
      const u=new URL(location.href);
      const id=u.searchParams.get('open');
      if(id && /^c\d{2}$/i.test(id)){
        u.searchParams.delete('open');
        const q=u.searchParams.toString();
        history.replaceState(null,'',u.pathname+(q?'?'+q:'')+'#card/'+id.toLowerCase());
      }
    })();
  </script>
  <script src="app-v8.js?v=9"></script>
  <script src="study-v10.js?v=10"></script>
  <script src="study-v11.js?v=11"></script>
  <script src="manual-ui-v12.js?v=12"></script>
  <script src="fix-card-links-v13.js?v=17"></script>
  <script src="astro-guide-v14.js?v=14"></script>
  <script src="interactive-reading-v14.js?v=14"></script>
  <script src="iconography-v15.js?v=17"></script>
</body>
</html>
